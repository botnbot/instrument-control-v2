<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Учёт инструментов{% endblock %}</title>
    <!-- Bootstrap 5 через CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'core:instrument_list' %}">🛠️ Учёт инструментов</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'core:instrument_list' %}">Инструменты</a>
            <a class="nav-link" href="{% url 'core:repairer_list' %}">Ремонтники</a>
            <a class="nav-link" href="{% url 'core:repair_list' %}">Ремонты</a>
            <a class="nav-link" href="{% url 'core:relocation_list' %}">Перемещения</a>
            {% if user.is_authenticated %}
    <span class="text-warning me-3">Вы вошли как: <strong>{{ user.first_name|default:user.username }}</strong></span>
    <form method="post" action="{% url 'logout' %}" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
    </form>
{% else %}
    <a class="btn btn-outline-light btn-sm" href="{% url 'rfid_login' %}">Войти по карте</a>
    <a class="btn btn-success btn-sm" href="{% url 'register' %}">Регистрация</a>
{% endif %}
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
