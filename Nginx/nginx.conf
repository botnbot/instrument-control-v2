events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Логи  для отладки
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Оптимизация
    sendfile        on;
    keepalive_timeout  65;

    upstream django {
        server web:8000;
    }


server {
    listen       80;
    server_name  192.168.88.6;

    # ===  (Учет инструментов) ===
    location /instruments/static/ {
        alias C:/instrument-control-v2/staticfiles/;
    }

    location /instruments/media/ {
        alias C:/instrument-control-v2/media/;
    }

    location /instruments/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === БУДУЩЕЕ ПРИЛОЖЕНИЕ ===
    # Пока оно не установлено, оставляем этот блок закомментированным.
    # Когда приложение появится, вы просто раскомментируете его
    # и впишете его реальный порт (например, 8080, 3000 или 5000).

    # location / {
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}